name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # make lint requires staticcheck; without this step the lint gate used to
      # report "not installed, skipping" and silently pass in CI.
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      # Full §13.1 gate set via Makefile verify (lint/test/race/accept/
      # test-generate/test-integration/test-deps).
      - name: make verify
        run: make verify
