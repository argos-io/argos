syntax = "proto3";

package nested.v1;

option go_package = "example.com/nested;nestedv1";

enum TopKind {
  TOP_KIND_UNSPECIFIED = 0;
  TOP_KIND_READY = 1;
}

// Alpha owns a nested message, a nested enum and three map fields, and is
// followed by another top-level message. That is exactly the shape where the
// flattened descriptor order (all top-level declarations first, then nested
// ones) diverges from a pre-order DFS walk.
message Alpha {
  message Beta {
    message Gamma {
      int32 g = 1;
    }
    Gamma gamma = 1;
    int32 b = 2;
  }

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ONE = 1;
  }

  Beta beta = 1;
  Kind kind = 2;
  map<string, Beta> betas = 3;
  map<int32, int64> plain = 4;
  TopKind top = 5;
  map<string, Kind> kinds = 6;
}

message Omega {
  int32 o = 1;
}

// The proto frontend requires at least one service; it is irrelevant to the
// message generator under test.
service NestedService {
  rpc Get(Alpha) returns (Omega);
}
