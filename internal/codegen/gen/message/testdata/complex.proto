syntax = "proto3";

package complex.v1;

option go_package = "example.com/complex;complexv1";

enum TopState {
  TOP_STATE_UNSPECIFIED = 0;
  TOP_STATE_READY = 1;
  live = 2;
}

message Outer {
  string snake_name = 1;
  repeated int32 numbers = 2;
  map<string, int64> labels = 3;
  Inner child = 4;
  TopState state = 5;
  optional string nickname = 6;
  optional int32 count = 7;

  // Explicitly unpacked: protoc-gen-go omits the packed element when the
  // field is not packed, even though proto3 repeats scalars by default.
  repeated int32 unpacked = 8 [packed = false];

  message Inner {
    uint32 id = 1;
  }

  enum LocalState {
    LOCAL_STATE_UNSPECIFIED = 0;
    LOCAL_STATE_ACTIVE = 1;
  }
}

service ComplexService {
  rpc Get(Outer) returns (Outer);
}
